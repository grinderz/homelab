# Cloud -> server mirror. See README.md.
services:
  cloud-sync:
    image: rclone/rclone:1.75
    container_name: cloud-sync
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    entrypoint: ["/scripts/loop.sh"]
    environment:
      TZ: ${TZ:-UTC}
      REMOTES: ${REMOTES:-yandex gdrive}
      INTERVAL: ${INTERVAL:-6h}
      HISTORY_DAYS: ${HISTORY_DAYS:-365}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      HEARTBEAT_TOKEN: ${HEARTBEAT_TOKEN:-}
      NOTIFY_URL: ${NOTIFY_URL:-http://notify:8000/notify/homelab}
      NOTIFY_OK: ${NOTIFY_OK:-}
    volumes:
      - ./config:/config/rclone
      - ./scripts:/scripts:ro
      - ${DATA_DIR}:/data
      - ${HISTORY_DIR}:/history
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
