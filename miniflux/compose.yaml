# Feed reader: miniflux with its own postgres. See README.md.
services:
  miniflux:
    image: miniflux/miniflux:2.3.3
    container_name: miniflux
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      DATABASE_URL: postgres://miniflux:${DB_PASSWORD}@db/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      # the admin comes with the database; set to 1 only for a fresh install
      CREATE_ADMIN: ${CREATE_ADMIN:-0}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      POLLING_FREQUENCY: "60"
      BATCH_SIZE: "10"
      FETCHER_ALLOW_PRIVATE_NETWORKS: "1"
    ports:
      - "${PORT:-8094}:8080"
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 1m
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: miniflux-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: miniflux
    volumes:
      - ${DATA_DIR}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
