# Backups of the server itself: backrest (web UI over restic). Repos and plans
# live in config/config.json, seeded once from the dotfiles render and owned by
# backrest/UI afterwards. See README.md.
services:
  backrest:
    image: garethgeorge/backrest:v1.14
    container_name: backrest
    restart: unless-stopped
    # root: reads every appdata dir regardless of owner, writes the repo as
    # nobody:users is not needed (restic repo is backrest's own)
    environment:
      TZ: ${TZ:-UTC}
      BACKREST_DATA: /data
      BACKREST_CONFIG: /data/config.json
      BACKREST_PORT: "9898"
      XDG_CACHE_HOME: /cache
    # seed the config on the first start only; later edits (UI or backrest
    # itself) stay in /data. To re-seed: delete /data/config.json
    entrypoint: ["/bin/sh", "-c", "[ -f /data/config.json ] || cp /seed/config.json /data/config.json; exec /backrest"]
    ports:
      - "${PORT:-9898}:9898"
    volumes:
      - ${DATA_DIR}:/data
      - ${CACHE_DIR}:/cache
      - ./config/config.json:/seed/config.json:ro
      - ${REPO_DIR}:/repos/local
      # sources, read-only; the paths inside match the plans in config.json
      - /mnt/user/appdata:/userdata/appdata:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9898/"]
      interval: 1m
      timeout: 10s
      retries: 3

networks:
  proxy:
    external: true
